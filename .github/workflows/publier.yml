# Reconstruit et publie le site sur GitHub Pages à chaque modification de la branche main
# (y compris les ajouts faits depuis Pages CMS). Dure environ une à deux minutes.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer Pillow
        run: pip install -r outils/requirements.txt

      - name: Construire le site
        run: python outils/construire.py

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v4
